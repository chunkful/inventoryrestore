[versions]
paper-api = "1.21.11-R0.1-SNAPSHOT"
minecraft = "1.21.11"
cloud = "2.0.0"
cloud-paper = "2.0.0-beta.10"
adventure = "4.26.1"
configurate = "4.2.0"
nbtapi = "2.15.7"
nitrite = "4.3.2"
mongodb = "5.8.0"

shadow = "9.4.2"
run-task = "3.0.2"
resource-factory = "1.3.1"
gremlin = "0.0.9"
minotaur = "2.9.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
configurate-hocon = { module = "org.spongepowered:configurate-hocon", version.ref = "configurate" }
nbtapi = { module = "de.tr7zw:item-nbt-api-plugin", version.ref = "nbtapi" }
nitrite = { module = "org.dizitart:nitrite", version.ref = "nitrite" }
nitrite-mvstore = { module = "org.dizitart:nitrite-mvstore-adapter", version.ref = "nitrite" }
mongodb = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
cloud = { module = "org.incendo:cloud-core", version.ref = "cloud" }
cloud-annotations = { module = "org.incendo:cloud-annotations", version.ref = "cloud" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-paper" }
cloud-minecraft-extras = { module = "org.incendo:cloud-minecraft-extras", version.ref = "cloud-paper" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
resource-factory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
gremlin-gradle = { id = "xyz.jpenilla.gremlin-gradle", version.ref = "gremlin" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
